services:
  luciq-mcp:
    build: .
    image: luciq-instabug-mcp:latest
    container_name: luciq-mcp
    restart: unless-stopped
    environment:
      PORT: "8080"
      HOST: 0.0.0.0
      LOG_LEVEL: info
      # CORS allowed origins for browser-based MCP clients (MCP Inspector,
      # custom web agents). "*" works as long as no credentials are sent.
      CORS_ORIGINS: "*"
    healthcheck:
      # The /healthz route always returns 200; if the process is wedged this
      # request hangs and the healthcheck fails.
      test: ["CMD", "node", "-e",
             "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
